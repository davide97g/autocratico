<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Autocratico — trailer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #050505; color: #f7f7f3; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; }
  #c { max-width: 100%; max-height: 100%; aspect-ratio: 16/9; background: #000; cursor: pointer; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; padding: 6px 12px; box-sizing: border-box; background: #0b0b0c; }
  #ui.hidden { display: none; } #ui.hidden ~ #wrap { bottom: 0; }
  #scrub { width: 100%; margin: 0; accent-color: #dc2627; }
  #marks { position: relative; height: 16px; }
  .mark { position: absolute; top: 0; height: 14px; border-left: 1px solid #dc2627; color: #8a8a92; font-size: 9px; overflow: hidden; white-space: nowrap; padding-left: 2px; cursor: pointer; box-sizing: border-box; }
  .mark:hover { color: #f7f7f3; background: #dc262722; }
  #info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8a8a92; }
  #errs { display: none; position: fixed; top: 8px; left: 8px; right: 8px; max-height: 40vh; overflow: auto; background: #300; color: #fbb; padding: 8px; white-space: pre-wrap; z-index: 9; }
  body.export #ui, body.export #errs { display: none !important; }
  body.export #wrap { inset: 0; }
  body.export #c { width: 1920px; height: 1080px; max-width: none; max-height: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui">
  <div id="marks"></div>
  <input id="scrub" type="range" min="0" value="0" />
  <div id="info"></div>
</div>
<pre id="errs"></pre>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
