<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Autocratico" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS launch screens (portrait, @3x): iPhone 12-14, 15-16, 14 Plus, 15-16 Plus/Pro Max. -->
    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <title>Autocratico</title>
    <script>
      // Before anything paints: the theme (no light flash in dark mode) and whether the launch animation plays.
      try {
        var theme = localStorage.getItem("theme") || "light"
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.classList.add(theme)
        var prefs = JSON.parse(localStorage.getItem("autocratico.prefs") || "{}")
        if (prefs.splash === false) document.documentElement.setAttribute("data-no-splash", "")
        if (prefs.reduceMotion) document.documentElement.setAttribute("data-reduce-motion", "")
      } catch (e) {}
    </script>
    <style>
      /* Launch screen: the mark stamps in, its letter draws itself, a highlight runs across; the app removes it when ready. */
      html { background: #e6e6e6; }
      html.dark { background: #0a0a0a; }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #e6e6e6; color: #1a1a1a;
        transition: opacity 380ms cubic-bezier(0.4, 0, 1, 1), visibility 0s linear 380ms;
      }
      .dark #splash { background: #0a0a0a; color: #ececec; }
      [data-no-splash] #splash { display: none; }
      #splash.splash-out { opacity: 0; visibility: hidden; pointer-events: none; }
      #splash.splash-out .splash-stack { transform: scale(1.06); filter: blur(6px); }
      .splash-stack {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        transition: transform 380ms cubic-bezier(0.4, 0, 1, 1), filter 380ms ease-in;
      }
      .splash-mark { width: 76px; height: 76px; overflow: visible; animation: splash-stamp 640ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .splash-mark .tile { fill: currentColor; }
      .splash-mark .letter {
        fill: #ececec; fill-opacity: 0; stroke: #ececec; stroke-width: 2.5; stroke-linejoin: round;
        stroke-dasharray: 340; stroke-dashoffset: 340;
        animation: splash-draw 700ms cubic-bezier(0.65, 0, 0.35, 1) 260ms forwards, splash-fill 300ms ease-out 820ms forwards;
      }
      .dark .splash-mark .letter { fill: #141414; stroke: #141414; }
      .splash-mark .shine { opacity: 0; animation: splash-shine 900ms cubic-bezier(0.16, 1, 0.3, 1) 900ms both; }
      .splash-word {
        font: 600 15px/1 "Geist Variable", ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.02em;
        display: flex; overflow: hidden;
      }
      .splash-word span { display: inline-block; transform: translateY(110%); animation: splash-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes splash-stamp { from { transform: scale(0.55) rotate(-10deg); opacity: 0; } }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-fill { to { fill-opacity: 1; stroke-width: 0; } }
      @keyframes splash-shine { from { opacity: 0.9; transform: translateX(-90px); } to { opacity: 0; transform: translateX(110px); } }
      @keyframes splash-rise { to { transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-mark .letter, .splash-mark .shine, .splash-word span { animation: none !important; }
        .splash-mark .letter { stroke-dashoffset: 0; fill-opacity: 1; stroke-width: 0; }
        .splash-word span { transform: none; }
      }
      [data-reduce-motion] .splash-mark, [data-reduce-motion] .splash-mark .letter, [data-reduce-motion] .splash-word span { animation: none !important; }
      [data-reduce-motion] .splash-mark .letter { stroke-dashoffset: 0; fill-opacity: 1; stroke-width: 0; }
      [data-reduce-motion] .splash-word span { transform: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-stack">
        <svg class="splash-mark" viewBox="0 0 100 100">
          <defs>
            <clipPath id="splash-clip"><rect width="100" height="100" rx="22" /></clipPath>
            <linearGradient id="splash-shine" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.45" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <rect class="tile" width="100" height="100" rx="22" />
          <path class="letter" fill-rule="evenodd" d="M44 20h12l21 60H64l-4.5-15h-19L36 80H23zm-6 36h24l-12-34z" />
          <g clip-path="url(#splash-clip)"><g transform="rotate(18 50 50)"><rect class="shine" x="0" y="-20" width="34" height="140" fill="url(#splash-shine)" /></g></g>
        </svg>
        <div class="splash-word"><span style="animation-delay:560ms">A</span><span style="animation-delay:588ms">u</span><span style="animation-delay:616ms">t</span><span style="animation-delay:644ms">o</span><span style="animation-delay:672ms">c</span><span style="animation-delay:700ms">r</span><span style="animation-delay:728ms">a</span><span style="animation-delay:756ms">t</span><span style="animation-delay:784ms">i</span><span style="animation-delay:812ms">c</span><span style="animation-delay:840ms">o</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
