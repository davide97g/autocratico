# Public demo. TLS ends at Cloudflare; the tunnel reaches this over loopback.
# Only static files: the demo's "server" runs in the visitor's page, so there is no /api here at all.
# The CSP allows Google Analytics (loaded only after consent), blob:/data: for the documents the page
# draws itself, and nothing else outside this origin. __INLINE_SCRIPTS__ becomes the hashes of the
# inline scripts in index.html (theme and launch screen) when the image is built.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml application/json application/manifest+json;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nothing answers /api: a request that gets here is a bug in the demo, not a server to reach.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"not found"}';
    }

    # Hashed bundles never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' __INLINE_SCRIPTS__ https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        # Hash routes (#inbox, #deadline/…): every path is the app.
        try_files $uri $uri/ /index.html;
    }
}
