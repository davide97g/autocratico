packages:
  - apps/*
  - packages/*
  # the trailer is a bun project of its own (apps/video/README.md)
  - '!apps/video'
  # the promo spots too: a Remotion project of its own (apps/promo/README.md)
  - '!apps/promo'

allowBuilds:
  core-js: false
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - turbo@2.11.7
